version: '3.8'

services:
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    depends_on:
      - redis
    environment:
      - PORT=9090
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "9090:9090"
    volumes:
      - ./assets:/app/assets

volumes:
  redis-data: